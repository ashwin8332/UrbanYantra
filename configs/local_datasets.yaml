  ghsl_built_h: ""   # optional 2018 height — used if present
  ghsl_population: "" # optional GHS-POP tile

  # D-07 Kaggle UHI Monitoring (Atharva Soundankar) — CSV path after download
  kaggle_uhi_csv: ""  # e.g. C:/Users/riya1/Downloads/uhi_monitoring.csv

  # D-09 EY Open Science Challenge 2025 — NYC labeled training (external validation / transfer learning)
