# Multi-city India pilot — aligned with hackathon deep-build spec (Section 2)
# bbox: [min_lon, min_lat, max_lon, max_lat] WGS84
# station coords: CPCB/IMD reference for offline calibration (Phase 4)

defaults:
  country: India
  crs: EPSG:4326
  target_resolution_m: 10
  data_mode: gee
  gee_project: western-avatar-491910-s2
  date_range:
    start: "2020-01-01"
    end: "2024-12-31"
    composite_method: median
    lst_months: [3, 4, 5, 6]  # Mar–Jun clear-sky summer LST for India UHI
  landsat:
    collection: LANDSAT/LC08/C02/T1_L2
    lst_band: ST_B10
    scale_factor: 0.00341802
    offset: 149.0
    cloud_cover_max: 20
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    cloud_probability_max: 40
  worldcover:
    collection: ESA/WorldCover/v200
    year: 2021
  era5_land:
    collection: ECMWF/ERA5_LAND/HOURLY
    variables:
      - temperature_2m
      - dewpoint_temperature_2m
      - u_component_of_wind_10m
      - v_component_of_wind_10m
      - surface_solar_radiation_downwards
  ghsl:
    building_height: JRC/GHSL/P2016/BUILD_HEIGHT
    population: JRC/GHSL/P2016/POP
  hotspot:
    moderate_delta_c: 2.0
    severe_delta_c: 4.0
    gi_star_p_threshold: 0.05
    gi_star_kernel: 5
  spatial_cv:
    tile_size_deg: 0.04
    holdout_fraction: 0.2
  scenarios:
    urban_greening:
      canopy_increase_pct: 25
      shade_factor: 0.15
    cool_roof:
      albedo_increase: 0.25
      roof_fraction: 0.35
    blue_infrastructure:
      water_fraction_increase: 0.05
      evap_cooling_c: 1.5
  intervention_costs_inr_per_sqm:
    urban_greening: 1200
    cool_roof: 450
    blue_infrastructure: 3500

cities:
  # ── Maharashtra ──────────────────────────────────────────────────────────
  Mumbai:
    city_name: Mumbai
    state: Maharashtra
    bbox: [72.78, 18.90, 72.96, 19.25]
    timezone: Asia/Kolkata
    stations:
      - {name: Bandra, lon: 72.8347, lat: 19.0544}
      - {name: Colaba, lon: 72.8177, lat: 18.9067}
    output_dir: outputs/mumbai

  Pune:
